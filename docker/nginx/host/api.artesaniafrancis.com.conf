# Nginx del SERVIDOR (host) — no va dentro del contenedor Docker.
#
# Instalación en Ubuntu/Debian:
#   sudo mkdir -p /var/www/certbot
#   sudo cp docker/nginx/host/api.artesaniafrancis.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/api.artesaniafrancis.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.artesaniafrancis.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requisitos: DNS A de api.artesaniafrancis.com → IP del servidor, puertos 80/443 abiertos.

# HTTP — certificado Let's Encrypt + redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.artesaniafrancis.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — termina SSL y reenvía al contenedor Docker (puerto 8090)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.artesaniafrancis.com;

    ssl_certificate     /etc/letsencrypt/live/api.artesaniafrancis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.artesaniafrancis.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host api.artesaniafrancis.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
