# PASO 1 — usar ESTE archivo ANTES de tener el certificado SSL.
# Después de certbot, reemplazar por api.artesaniafrancis.com.conf
#
#   sudo cp docker/nginx/host/api.artesaniafrancis.com.init.conf \
#           /etc/nginx/sites-available/api.artesaniafrancis.com.conf
#   sudo ln -sf /etc/nginx/sites-available/api.artesaniafrancis.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.artesaniafrancis.com
#   sudo cp docker/nginx/host/api.artesaniafrancis.com.conf \
#           /etc/nginx/sites-available/api.artesaniafrancis.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.artesaniafrancis.com;

    client_max_body_size 32M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host api.artesaniafrancis.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
